<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>唱片行舞台 · 配置預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#111; --gold:#b8860b; --mono:'Space Mono',monospace; }
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f2ec;color:#111;font-family:var(--mono);font-size:12px;}
  .wrap{max-width:520px;margin:0 auto;padding:10px 14px 40px;}
  h1{font-size:14px;letter-spacing:.1em;margin:14px 0 4px;}
  .note{font-size:10px;color:#888;line-height:1.85;margin-bottom:10px;}
  .ctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .ctl button{font-family:var(--mono);font-size:10px;font-weight:700;padding:6px 9px;border:1px solid #111;background:#fff;cursor:pointer;}
  .ctl button.on{background:#111;color:#fff;}

  /* ══════════ 舞台：三層疊圖 ══════════════════════════════════
     背景 shop-bg.png（牆／門洞／封面牆／地板／地毯）
       └ 門板 shop-door-{0,1,2}.png（會開會關）
         └ 小人（z-index 4）
           └ 前景 shop-fg.png（櫃檯、器材、挖寶櫃、紙箱；z-index 6）
     前景蓋在小人上面，所以老闆站櫃檯後面自然被檯身擋到腰，
     走出來也一定要先往左移出櫃檯範圍再往前，不會再穿過櫃檯。
     場景邏輯尺寸 380×320，站位一律換算成 %，手機桌機比例一致。 */
  .rpg{border:2px solid var(--black);background:#000;margin:6px 0 12px;}
  .rpg-stage{position:relative;width:100%;aspect-ratio:448/492;overflow:hidden;
    background:#3a2a18 url('art/shop2-bg.jpg') center center / 100% 100% no-repeat;}
  .rpg-fg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .rpg-fg.back{z-index:6;}          /* 櫃檯＋喇叭＋右邊挖寶櫃：下緣 y≤400 */
  .rpg-fg.front{z-index:20;}        /* 挖寶櫃＋紙箱：下緣 y≥402 */
  .rpg-door{position:absolute;z-index:2;pointer-events:none;
    left:2.68%;top:31.50%;width:17.14%;}
  .rpg-spr{position:absolute;width:17.41%;z-index:4;line-height:0;
    transition:left .85s ease-in-out, bottom .7s ease-in-out, opacity .3s;}
  .rpg-spr svg{display:block;width:100%;height:auto;}
  .rpg-spr.hide{opacity:0;}
  .rpg-spr.dig{animation:rpgDig .62s ease-in-out infinite;}
  @keyframes rpgDig{0%,100%{transform:translateY(0);}50%{transform:translateY(3%);}}
  .rpg-anger{position:absolute;left:-20%;top:-26%;line-height:1;opacity:0;
    font-size:min(3.8vw,18px);}
  .rpg-anger.on{opacity:1;}
  .rpg-notes{position:absolute;z-index:5;width:14%;height:18%;pointer-events:none;opacity:0;
    left:47%;bottom:43%;}
  .rpg-notes.on{opacity:1;}
  .rpg-notes span{position:absolute;left:6%;bottom:0;font-size:min(4.2vw,19px);font-weight:700;
    color:#2a1c0e;text-shadow:0 1px 0 rgba(255,255,255,.45);}
  .rpg-notes.on span{animation:rpgNote 1.9s ease-out infinite;}
  .rpg-notes.on span:nth-child(2){left:38%;animation-delay:.63s;}
  .rpg-notes.on span:nth-child(3){left:70%;animation-delay:1.26s;}
  @keyframes rpgNote{0%{transform:translateY(0) scale(.7);opacity:0;}15%{opacity:1;}
    100%{transform:translateY(-64px) translateX(9px) scale(1.1);opacity:0;}}

  .rpg-win{position:relative;background:#000;color:#fff;border:4px double #fff;padding:16px 16px 22px;min-height:92px;}
  .rpg-name{position:absolute;left:12px;top:-12px;background:#000;color:#fff;border:2px solid #fff;padding:1px 10px;font-size:11px;font-weight:700;letter-spacing:.1em;}
  .rpg-name.foe{border-color:#ff6b7a;color:#ff6b7a;}
  .rpg-text{font-size:13px;line-height:1.95;letter-spacing:.04em;}
  .rpg-next{position:absolute;right:12px;bottom:6px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>唱片行舞台 · 新配置預覽</h1>
  <div class="note">
背景與家具是<b>描</b>店主提供的參考圖（<code>art/ref-shop.jpg</code>）而來：把家具從圖上挖掉、補回牆與地板當背景層，挖下來的家具當前景層（<code>scripts/trace-shop-art.py</code>）。
    <b>櫃檯／挖寶櫃／紙箱是獨立的前景層、蓋在小人上面</b>，所以老闆站櫃檯後面會被檯身擋住，
    要走出來只能先往左移出櫃檯再往前。門板另外三格，客人推門會開。
  </div>
  <div class="ctl">
    <button class="on" data-s="0">① 推門進來</button>
    <button data-s="1">② 老闆放唱片</button>
    <button data-s="2">③ 老闆去挖片</button>
    <button data-s="3">④ 結帳</button>
    <button data-s="4">⑤ 走到門口撞見</button>
    <button data-s="5">⑥ 老闆出來緩頰</button>
  </div>

  <div class="rpg">
    <div class="rpg-stage" id="stage">
      <img class="rpg-door" id="door" src="art/shop2-door-0.png" alt="">
      <div class="rpg-notes" id="notes"><span>♪</span><span>♫</span><span>♪</span></div>
      <div class="rpg-spr" id="o"></div>
      <div class="rpg-spr" id="p"><div class="rpg-anger" id="anger">💢</div></div>
      <div class="rpg-spr hide" id="f"></div>
      <img class="rpg-fg back" src="art/shop2-fg-back.png" alt="">
      <img class="rpg-fg front" src="art/shop2-fg-front.png" alt="">
    </div>
    <div class="rpg-win">
      <div class="rpg-name" id="wname">老闆</div>
      <div class="rpg-text" id="wtext"></div>
      <div class="rpg-next">▼</div>
    </div>
  </div>

  <div class="note" id="posnote"></div>
</div>

<script src="dip-character.js?v=2"></script>
<script>
  // 場景邏輯 448×492（＝參考圖 1792×1970 ÷4）。小人 SVG 是 16×16 格，
  // 人物只佔中間 10 格 → SVG 寬 60 時人物實寬約 37，剛好塞進檯面器材的空檔。
  const LW=448, LH=492, SVG=78, FOOT=5;    // FOOT：SVG 底部到腳底的空白
  const pc = (cx,y)=>({ left:((cx-SVG/2)/LW*100).toFixed(2)+'%',
                        bottom:((LH-(y+FOOT))/LH*100).toFixed(2)+'%' });

  // 站位（邏輯座標；跟 scripts/trace-shop-art.py 的家具座標對齊）
  // 櫃檯 x 102–307、檯面上緣 y=299（前景層從這裡開始遮住小人）、檯身下緣 400
  // 檯面器材：唱盤 190–247、右喇叭 257–290（左喇叭拿掉）→ 老闆站檯面左半 cx 145
  const POS = {
    p:{ door:[48,408],        // 剛推門進來，站在門口
        browse:[190,455],     // 自己逛（離櫃檯夠遠，不會疊到）
        pay:[168,430],        // 結帳：站在櫃檯前（腳底 > 402 → 蓋在櫃檯上面）
        leaving:[132,418],    // 準備離開，往門口走
        atdoor:[128,420] },   // 在門口撞見男子（跟男子拉開，中間留給老闆）
    o:{ counter:[145,325],    // 櫃檯後面（腳底貼著牆，被檯面擋到胸口）
        aisle:[72,345],       // 繞出櫃檯左端
        dig1:[318,410],       // 右邊唱片區：翻找（腳底 402–458 → 櫃檯前、挖寶櫃後）
        dig2:[372,404],
        dig3:[340,414],
        back:[150,424],       // 拿著四張走回櫃檯
        between:[85,452] },   // 站到兩人中間緩頰（腳底最前面 → 蓋在兩人上面）
    f:{ outside:[42,336], door:[42,344], in:[42,396] },
  };

  const SPRITES = {
    owner: sprRows(['................','.....dddddd.....','....dddddddd....','....dssssssd....','....ekkeekke....','....sdssssds....','.....dddddd.....'],
      'w','d',{8:'...wnnnnnnnnw...',9:'...snnnnnnnns...',10:'...snnnnnnnns...',11:'....nnnnnnnn....'}),
    foe: sprRows(['.....gggggg.....','.....kkkkkk.....','....kkkkkkkk....','...gksssssskg...','...gssksskssg...','....ssssssss....','.....ssssss.....'],'w','b'),
  };
  const AV = { head:'neat', hair:'k', shirt:'b', pants:'k', skin:'s' };
document.getElementById('o').insertAdjacentHTML('afterbegin', pixArtHTML(SPRITES.owner, 96));
  document.getElementById('p').insertAdjacentHTML('afterbegin', pixArtHTML(avatarRows(AV), 96));
  document.getElementById('f').insertAdjacentHTML('afterbegin', pixArtHTML(SPRITES.foe, 96));

  const $ = id => document.getElementById(id);
  // 前景分兩層：back（櫃檯／喇叭／右櫃，下緣 y≤400）z6、front（挖寶櫃／紙箱，下緣 y≥402）z20。
  // 小人依腳底 y 夾進去，才會「站在櫃檯前面、但在挖寶櫃後面」；同一層裡再照深度互相排序。
  const zOf = y => y < 402 ? 2                        // 還在櫃檯後面
                 : y < 458 ? 7 + Math.round((y - 402) / 8)    // 櫃檯前、挖寶櫃後
                           : 21 + Math.round((y - 458) / 8);  // 全部之前
  function put(id, group, key, instant){
    const el=$(id), q=POS[group][key], s=pc(q[0],q[1]);
    if(instant){ el.style.transition='none'; }
    el.style.left=s.left; el.style.bottom=s.bottom;
    el.style.zIndex = zOf(q[1]);
    if(instant){ void el.offsetWidth; el.style.transition=''; }
  }
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  async function doorAnim(open){
    const seq = open ? [1,2] : [1,0];
    for(const f of seq){ $('door').src='art/shop2-door-'+f+'.png'; await wait(190); }
  }

  // 老闆離開櫃檯：先沿著檯後往左（被檯身擋住），繞出櫃檯範圍後才往前走
  async function ownerOut(){
    put('o','o','counter',true); await wait(60);
    put('o','o','aisle');  await wait(900);
    put('o','o','out');    await wait(760);
  }

  const SCENES = [
    { name:'① 推門進來', who:'', text:'下著雨。你推開巷子裡那間唱片行的門。門上的鈴鐺，響了一聲。',
      run: async ()=>{
        put('p','p','door',true); put('o','o','counter',true); $('f').classList.add('hide');
        $('notes').classList.remove('on'); $('anger').classList.remove('on');
        await doorAnim(true); await wait(420); await doorAnim(false);
      } },
    { name:'② 老闆放唱片', who:'', text:'你抬起頭。老闆正把一張唱片放上唱盤。櫃檯上還攤著兩張，封套邊緣磨損嚴重，顯然塵封已久。',
      run: async ()=>{
        put('p','p','browse',true); put('o','o','counter',true); $('f').classList.add('hide');
        $('anger').classList.remove('on'); $('door').src='art/shop2-door-0.png';
        await wait(300); $('notes').classList.add('on');
      } },
    { name:'③ 老闆去挖片', who:'', text:'老闆不發一語，走出櫃檯，在右邊那排唱片裡翻翻找找。',
      run: async ()=>{
        put('p','p','browse',true); $('f').classList.add('hide');
        $('notes').classList.remove('on'); $('anger').classList.remove('on');
        $('door').src='art/shop2-door-0.png';
        put('o','o','counter',true); await wait(120);
        put('o','o','aisle'); await wait(820);    // 繞出櫃檯左端
        for(const k of ['dig1','dig2','dig3','dig2']){   // 在右邊唱片區東翻西找
          put('o','o',k); $('o').classList.add('dig'); await wait(720);
        }
        $('o').classList.remove('dig');
      } },
    { name:'④ 結帳（五張到手）', who:'老闆', text:'「這四張也很適合你，跟你很有緣，收下吧。」',
      run: async ()=>{
        $('f').classList.add('hide'); $('notes').classList.remove('on');
        $('anger').classList.remove('on'); $('door').src='art/shop2-door-0.png';
        put('o','o','dig2',true); put('p','p','browse',true); await wait(100);
        put('o','o','back'); put('p','p','pay');  // 兩人一起移到櫃檯
        await wait(850);
        put('o','o','aisle'); await wait(700);
        put('o','o','counter'); await wait(700);  // 老闆回到櫃檯裡
      } },
    { name:'⑤ 走到門口撞見', who:'男子', text:'「……這品味，也敢出來丟臉？」',
      run: async ()=>{
        put('o','o','counter',true);              // 老闆還在櫃檯裡
        put('p','p','pay',true); put('f','f','outside',true);
        $('notes').classList.remove('on'); $('anger').classList.remove('on');
        await wait(80);
        put('p','p','leaving'); await wait(700);  // 玩家往門口走
        $('f').classList.remove('hide');
        await doorAnim(true);                      // 門開，男子進來
        put('f','f','in'); put('p','p','atdoor');
        await wait(850); await doorAnim(false);
        $('anger').classList.add('on');
      } },
    { name:'⑥ 老闆出來緩頰', who:'老闆', text:'「既然雙方都不服氣，不如來一場品味對決如何？」',
      run: async ()=>{
        put('p','p','atdoor',true); put('f','f','in',true);
        $('f').classList.remove('hide'); $('anger').classList.add('on');
        $('notes').classList.remove('on'); $('door').src='art/shop2-door-0.png';
        put('o','o','counter',true); await wait(120);
        put('o','o','aisle');   await wait(900);   // 沿檯後往左，繞出櫃檯
        put('o','o','between'); await wait(800);   // 走到兩人之間
      } },
  ];

  let busy=false;
  async function show(i){
    if(busy) return; busy=true;
    const s=SCENES[i];
    const nm=$('wname'); nm.textContent=s.who; nm.style.display=s.who?'':'none';
    nm.className='rpg-name'+(s.who==='男子'?' foe':'');
    $('wtext').textContent=s.text;
    document.querySelectorAll('.ctl button').forEach((b,j)=>b.classList.toggle('on', j===i));
    await s.run();
    const st=$('stage').getBoundingClientRect();
    $('posnote').textContent = `舞台 ${Math.round(st.width)}×${Math.round(st.height)}px（邏輯 448×492）`
      + `　·　描自 art/ref-shop.jpg　·　前景層（櫃檯／挖寶櫃／紙箱）蓋在小人上面`;
    busy=false;
  }
  document.querySelectorAll('.ctl button').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.s)));
  show(0);
</script>
</body>
</html>
