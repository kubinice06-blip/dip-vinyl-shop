<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>唱片行舞台 · 配置預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#111; --gold:#b8860b; --dmg:#c11628; --mono:'Space Mono',monospace; }
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f2ec;color:#111;font-family:var(--mono);font-size:12px;}
  .wrap{max-width:560px;margin:0 auto;padding:10px 14px 40px;}
  h1{font-size:14px;letter-spacing:.1em;margin:14px 0 4px;}
  .note{font-size:10px;color:#888;line-height:1.8;margin-bottom:10px;}
  .ctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .ctl button{font-family:var(--mono);font-size:10px;font-weight:700;padding:6px 9px;border:1px solid #111;background:#fff;cursor:pointer;}
  .ctl button.on{background:#111;color:#fff;}

  /* ══════════ 新版舞台：背景改成 art/shop-room.png（scripts/build-shop-bg.py 產） ══════════
     圖左邊貼齊舞台左邊，所以站位一律用 px（跟圖裡的家具座標對齊）；
     寬螢幕只是多露出右邊那個挖寶櫃，家具不會位移。 */
  .rpg{border:2px solid var(--black);background:#000;margin:6px 0 12px;}
  .rpg-stage{position:relative;height:232px;overflow:hidden;background:#c49a60 url('art/shop-room.png') left bottom / auto 232px no-repeat;
    image-rendering:pixelated;}

  /* 小人：走道（圖上 x 0–160）淨空，老闆站櫃檯後面靠 bottom 抬高假裝深度 */
  .rpg-spr{position:absolute;bottom:18px;left:26px;z-index:4;line-height:0;transition:left .9s ease,bottom .9s ease;}
  .rpg-spr svg{display:block;}
  .rpg-spr.o.behind{z-index:2;}
  .rpg-anger{position:absolute;left:-9px;top:-13px;font-size:16px;line-height:1;opacity:0;}
  .rpg-anger.on{opacity:1;}
  .rpg-notes{position:absolute;left:150px;bottom:112px;width:60px;height:70px;z-index:5;pointer-events:none;opacity:0;}
  .rpg-notes.on{opacity:1;}
  .rpg-notes span{position:absolute;left:8px;bottom:0;font-size:16px;font-weight:700;color:#2a1c0e;text-shadow:0 1px 0 rgba(255,255,255,.4);}
  .rpg-notes.on span{animation:rpgNote 1.8s ease-out infinite;}
  .rpg-notes.on span:nth-child(2){left:24px;animation-delay:.6s;} .rpg-notes.on span:nth-child(3){left:40px;animation-delay:1.2s;}
  @keyframes rpgNote{0%{transform:translateY(0) scale(.7);opacity:0;}15%{opacity:1;}100%{transform:translateY(-56px) translateX(8px) scale(1.1);opacity:0;}}

  /* 對話窗（照現行樣式，只為了看整體比例） */
  .rpg-win{position:relative;background:#000;color:#fff;border:4px double #fff;padding:16px 16px 22px;min-height:96px;}
  .rpg-name{position:absolute;left:12px;top:-12px;background:#000;color:#fff;border:2px solid #fff;padding:1px 10px;font-size:11px;font-weight:700;letter-spacing:.1em;}
  .rpg-name.foe{border-color:#ff6b7a;color:#ff6b7a;}
  .rpg-text{font-size:13px;line-height:1.95;letter-spacing:.04em;}
  .rpg-next{position:absolute;right:12px;bottom:6px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>唱片行舞台 · 新配置預覽</h1>
  <div class="note">
    像素背景圖（<code>scripts/build-shop-bg.py</code> 產 <code>art/shop-room.png</code>）＋小人疊在上面。牆上封面展示 3×4、牆架唱片書背、櫃檯（喇叭＋唱盤＋擴大機）、
    地上兩個挖寶櫃與兩個紙箱、木板牆與木地板。舞台高度 190 → <b>230px</b>。<br>
    下面三顆按鈕＝序章的三個時間點，看人物走位有沒有被家具擋到。
  </div>
  <div class="ctl">
    <button class="on" data-s="0">① 推門進來</button>
    <button data-s="1">② 老闆放唱片（音符）</button>
    <button data-s="2">③ 男子嗆聲（三人同框）</button>
  </div>

  <div class="rpg">
    <div class="rpg-stage" id="stage">
      <div class="rpg-notes" id="notes"><span>♪</span><span>♫</span><span>♪</span></div>
      <div class="rpg-spr o behind" id="o"></div>
      <div class="rpg-spr p" id="p"><div class="rpg-anger" id="anger">💢</div></div>
      <div class="rpg-spr f" id="f"></div>
    </div>
    <div class="rpg-win">
      <div class="rpg-name" id="wname">老闆</div>
      <div class="rpg-text" id="wtext">下著雨。你推開巷子裡那間唱片行的門。門上的鈴鐺，響了一聲。</div>
      <div class="rpg-next">▼</div>
    </div>
  </div>

  <div class="note" id="posnote"></div>
</div>

<script src="dip-character.js?v=2"></script>
<script>
  // 舞台用得到的三個小人（與 roguelike.html 同一份定義）
  const SPR = {
    owner: sprRows(['................','.....dddddd.....','....dddddddd....','....dssssssd....','....ekkeekke....','....sdssssds....','.....dddddd.....'],
      'w','d',{8:'...wnnnnnnnnw...',9:'...snnnnnnnns...',10:'...snnnnnnnns...',11:'....nnnnnnnn....'}),
    e0: sprRows(['.....gggggg.....','.....kkkkkk.....','....kkkkkkkk....','...gksssssskg...','...gssksskssg...','....ssssssss....','.....ssssss.....'],'w','b'),
  };
  const AV = { head:'neat', hair:'k', shirt:'b', pants:'k', skin:'s' };
  document.getElementById('o').insertAdjacentHTML('afterbegin', pixArtHTML(SPR.owner, 40));
  document.getElementById('p').insertAdjacentHTML('afterbegin', pixArtHTML(avatarRows(AV), 40));
  document.getElementById('f').insertAdjacentHTML('afterbegin', pixArtHTML(SPR.e0, 40));

  // 新版站位（left%／bottom px）
  // px（對齊 art/shop-room.png 的家具座標）：走道 0–160、櫃檯 130–255、前景家具 x>168
  const POS = {
    p:{ door:[26,18], shelf:[62,18], mid:[92,18], leave:[118,18] },
    o:{ counter:[152,62], floor:[105,18], between:[70,18] },
    f:{ out:[-46,18], door:[16,18] },
  };
  const SCENES = [
    { p:'door', o:'counter', f:'out', notes:false, anger:false, who:'', text:'下著雨。你推開巷子裡那間唱片行的門。門上的鈴鐺，響了一聲。' },
    { p:'mid',  o:'counter', f:'out', notes:true,  anger:false, who:'', text:'你抬起頭。老闆正把一張唱片放上唱盤。櫃檯上還攤著兩張，封套邊緣磨損嚴重，顯然塵封已久。' },
    { p:'leave',o:'between', f:'door', notes:false, anger:true, who:'男子', text:'「……這品味，也敢出來丟臉？」' },
  ];
  function put(id,key,pos){ const el=document.getElementById(id), q=POS[key][pos]; el.style.left=q[0]+'px'; el.style.bottom=q[1]+'px'; }
  function show(i){
    const s=SCENES[i];
    put('o','o',s.o); put('p','p',s.p); put('f','f',s.f);
    document.getElementById('notes').classList.toggle('on', s.notes);
    document.getElementById('anger').classList.toggle('on', s.anger);
    const nm=document.getElementById('wname');
    nm.textContent=s.who; nm.style.display=s.who?'':'none'; nm.className='rpg-name'+(s.who==='男子'?' foe':'');
    document.getElementById('wtext').textContent=s.text;
    document.querySelectorAll('.ctl button').forEach((b,j)=>b.classList.toggle('on', j===i));
    const st=document.getElementById('stage').getBoundingClientRect();
    document.getElementById('posnote').textContent =
      `舞台 ${Math.round(st.width)}×${Math.round(st.height)}px　·　背景圖 540×232（左貼齊，寬螢幕多露右邊）　·　站位：你 ${POS.p[s.p][0]}px／老闆 ${POS.o[s.o][0]}px／男子 ${POS.f[s.f][0]}px`;
  }
  document.querySelectorAll('.ctl button').forEach(b=>b.addEventListener('click',()=>show(+b.dataset.s)));
  show(0);
</script>
</body>
</html>
