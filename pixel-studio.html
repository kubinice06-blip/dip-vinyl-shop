<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素工坊 · dip</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#111; --gold:#b8860b; --line:#d8d4cc; --gray:#777; --bg:#f4f2ec; --panel:#fff; --mono:'Space Mono',ui-monospace,monospace; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--black); font-family:var(--mono); font-size:11px; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; padding:6px 12px; border-bottom:2px solid var(--black); background:#fff; flex:0 0 auto; }
  header b{ font-size:13px; letter-spacing:.1em; }
  .modes{ display:flex; border:1px solid var(--black); }
  .modes button{ font-family:var(--mono); font-size:10px; font-weight:700; padding:6px 12px; border:0; border-right:1px solid var(--black); background:#fff; cursor:pointer; }
  .modes button:last-child{ border-right:0; }
  .modes button.on{ background:var(--black); color:#fff; }
  #saveState{ margin-left:auto; color:var(--gray); font-size:10px; }
  .app{ flex:1 1 auto; display:grid; grid-template-columns:200px 1fr 300px; min-height:0; }
  aside{ background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:8px; }
  #side{ border-right:0; border-left:1px solid var(--line); }
  main{ min-width:0; min-height:0; overflow:auto; position:relative; }
  section.view{ display:none; height:100%; }
  section.view.on{ display:block; }
  h3{ font-size:10px; letter-spacing:.12em; color:var(--gray); margin:10px 0 4px; text-transform:uppercase; }
  h3:first-child{ margin-top:0; }
  .lib-item{ display:flex; align-items:center; gap:6px; padding:4px 6px; cursor:pointer; border:1px solid transparent; }
  .lib-item:hover{ background:#f1efe8; }
  .lib-item.on{ border-color:var(--black); background:#fff; }
  .lib-item .th{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:repeating-conic-gradient(#e6e3db 0 25%,#fff 0 50%) 0 0/8px 8px; flex:0 0 auto; overflow:hidden; }
  .lib-item .th svg,.lib-item .th img{ max-width:100%; max-height:100%; image-rendering:pixelated; }
  .lib-item .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-item small{ color:var(--gray); }
  button.b, .b{ font-family:var(--mono); font-size:10px; font-weight:700; padding:5px 8px; border:1px solid var(--black); background:#fff; color:var(--black); cursor:pointer; text-decoration:none; display:inline-block; }
  button.b:hover{ background:#f1efe8; }
  button.b.pri{ background:var(--black); color:#fff; }
  button.b.on{ background:var(--gold); color:#fff; border-color:var(--gold); }
  button.b:disabled{ opacity:.4; cursor:default; }
  .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  label.f{ display:flex; flex-direction:column; gap:2px; font-size:10px; color:var(--gray); }
  label.f.inl{ flex-direction:row; align-items:center; gap:4px; }
  input[type=text],input[type=number],select,textarea{ font-family:var(--mono); font-size:11px; padding:4px 6px; border:1px solid var(--line); background:#fff; color:var(--black); width:100%; }
  input[type=number]{ width:64px; }
  textarea{ resize:vertical; min-height:48px; }
  .tools{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
  .tools button{ font-size:10px; padding:6px 2px; }
  .sw-wrap{ display:flex; flex-wrap:wrap; gap:3px; }
  .sw{ width:22px; height:22px; border:2px solid #fff; outline:1px solid var(--line); cursor:pointer; position:relative; font-size:8px; line-height:18px; text-align:center; color:#fff; text-shadow:0 0 2px #000; }
  .sw.on{ outline:2px solid var(--black); }
  .sw.clear{ background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px; color:#444; text-shadow:none; }
  .canvas-wrap{ padding:14px; overflow:auto; height:100%; }
  #oc{ background:repeating-conic-gradient(#e6e3db 0 25%,#fff 0 50%) 0 0/16px 16px; cursor:crosshair; display:block; touch-action:none; box-shadow:0 0 0 1px var(--black); }
  .frames{ display:flex; gap:4px; flex-wrap:wrap; }
  .frames .fr{ width:46px; height:46px; border:1px solid var(--line); background:repeating-conic-gradient(#e6e3db 0 25%,#fff 0 50%) 0 0/8px 8px; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative; }
  .frames .fr.on{ border:2px solid var(--black); }
  .frames .fr svg,.frames .fr img{ max-width:100%; max-height:100%; image-rendering:pixelated; }
  .frames .fr i{ position:absolute; left:2px; top:0; font-style:normal; font-size:8px; color:var(--gray); }
  .stage-wrap{ padding:14px; height:100%; overflow:auto; }
  .stage{ position:relative; display:inline-block; box-shadow:0 0 0 2px var(--black); background:#3a2a18; line-height:0; }
  .stage canvas{ image-rendering:pixelated; display:block; }
  .stage canvas.ov{ position:absolute; left:0; top:0; touch-action:none; }
  .items .it{ display:flex; align-items:center; gap:4px; padding:3px 4px; cursor:pointer; border:1px solid transparent; }
  .items .it.on{ border-color:var(--black); background:#fff; }
  .items .it:hover{ background:#f1efe8; }
  .items .it .nm{ flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .items .it .ic{ cursor:pointer; opacity:.5; }
  .items .it .ic.on{ opacity:1; }
  .role{ font-size:9px; padding:0 4px; border:1px solid var(--gold); color:var(--gold); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:3px 8px; font-size:10px; color:var(--gray); }
  .kv b{ color:var(--black); font-weight:400; }
  .beat{ border:1px solid var(--line); background:#fff; padding:6px; margin-bottom:6px; }
  .beat.on{ border-color:var(--black); box-shadow:0 0 0 1px var(--black); }
  .beat .hd{ display:flex; gap:6px; align-items:center; }
  .beat .hd .n{ font-size:9px; color:var(--gray); width:24px; }
  .beat textarea{ min-height:40px; margin-top:4px; }
  .beat .st{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; align-items:center; }
  .beat .st select,.beat .st input{ width:auto; }
  .beat .st .lb{ font-size:9px; color:var(--gray); }
  .rpg-win{ position:relative; background:#000; color:#fff; border:4px double #fff; padding:16px 16px 22px; min-height:88px; margin-top:8px; }
  .rpg-name{ position:absolute; left:12px; top:-12px; background:#000; color:#fff; border:2px solid #fff; padding:1px 10px; font-size:11px; font-weight:700; letter-spacing:.1em; }
  .rpg-name.foe{ border-color:#ff6b7a; color:#ff6b7a; }
  .rpg-text{ font-size:13px; line-height:1.95; letter-spacing:.04em; }
  .io{ padding:16px; max-width:820px; }
  .io .box{ border:1px solid var(--line); background:#fff; padding:12px; margin-bottom:14px; }
  .io .box h4{ margin:0 0 6px; font-size:11px; letter-spacing:.08em; }
  .io p{ color:var(--gray); line-height:1.8; margin:4px 0 8px; }
  .log{ font-size:10px; background:#111; color:#ddd; padding:8px; max-height:180px; overflow:auto; white-space:pre-wrap; margin-top:8px; }
  .story-wrap{ display:grid; grid-template-columns:1fr 360px; gap:14px; padding:14px; height:100%; overflow:auto; }
  .story-wrap > div{ min-width:0; }
  .hint{ color:var(--gray); font-size:10px; line-height:1.7; }
  kbd{ font-family:var(--mono); border:1px solid var(--line); padding:0 3px; font-size:9px; }
  @media (max-width:900px){ .app{ grid-template-columns:150px 1fr; } #side{ grid-column:1/-1; border-top:1px solid var(--line); } .story-wrap{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <b>🎨 像素工坊</b>
  <nav class="modes">
    <button data-m="obj" class="on">🖌 物件</button>
    <button data-m="scene">🏞 場景</button>
    <button data-m="story">🎬 劇本</button>
    <button data-m="io">🔁 交接</button>
  </nav>
  <span id="saveState">本機草稿</span>
</header>
<div class="app">
  <aside id="lib">
    <h3>物件 <button class="b" id="libNewObj" title="新的像素物件">＋</button></h3>
    <div id="libObjs"></div>
    <h3>場景 <button class="b" id="libNewScene">＋</button></h3>
    <div id="libScenes"></div>
    <h3>劇本 <button class="b" id="libNewStory">＋</button></h3>
    <div id="libStories"></div>
  </aside>

  <main>
    <section class="view on" id="v-obj"><div class="canvas-wrap"><div class="hint" id="objEmpty">左邊按「＋」開一個物件，或從交接分頁載入 <code>art/pixel/</code>。</div><canvas id="oc" hidden></canvas></div></section>
    <section class="view" id="v-scene"><div class="stage-wrap"><div class="hint" id="sceneEmpty">左邊按「＋」開一個場景。</div><div class="stage" id="stage" hidden><canvas id="sc"></canvas><canvas id="sco" class="ov"></canvas></div><div class="hint" id="sceneRead" style="margin-top:8px"></div></div></section>
    <section class="view" id="v-story">
      <div class="story-wrap">
        <div>
          <div class="row"><b id="stTitle"></b><span class="hint" id="stSceneName"></span></div>
          <div class="stage" id="ststage" hidden><canvas id="stc"></canvas><canvas id="stco" class="ov"></canvas></div>
          <div class="rpg-win" id="stWin" hidden><div class="rpg-name" id="stName"></div><div class="rpg-text" id="stText"></div></div>
          <div class="row" style="margin-top:8px">
            <button class="b" id="stFirst">⏮ 從頭</button><button class="b" id="stPrev">◀</button><button class="b pri" id="stNext">▶ 下一段</button>
            <button class="b" id="stPlay">▶▶ 自動播放</button><span class="hint" id="stPos"></span>
          </div>
          <div class="hint" id="storyEmpty">左邊按「＋」開一個劇本，再指定它用哪個場景。演員＝場景裡 role 設成 p／o／f 的物件；站位＝場景裡同組的站位名。</div>
        </div>
        <div id="beats"></div>
      </div>
    </section>
    <section class="view" id="v-io"><div class="io" id="ioPanel"></div></section>
  </main>

  <aside id="side"></aside>
</div>

<script src="dip-pixel.js?v=1"></script>
<script>
'use strict';
const P = window.DipPixel;
const $ = id => document.getElementById(id), $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,8);
const KEY_POOL = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*+=?~';
const hex6 = c => { c = String(c||'').trim(); const m = /^#([0-9a-f]{3})$/i.exec(c); return m ? '#' + m[1].split('').map(x=>x+x).join('') : c.slice(0,7); };   // <input type=color> 只吃 #rrggbb
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800); }
function readFile(file, as){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; as==='text'? r.readAsText(file) : r.readAsDataURL(file); }); }
function pickFile(accept, as){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=async()=>{ const f=i.files[0]; res(f? {file:f, data: await readFile(f, as)} : null); }; i.click(); }); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('已複製到剪貼簿'); }catch(e){ prompt('瀏覽器不給剪貼簿權限，自己複製：', t); } }
let _toastT; function toast(m){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;font-size:11px;z-index:99;border:1px solid var(--gold);transition:opacity .3s'; document.body.appendChild(t); } t.textContent=m; t.style.opacity='1'; clearTimeout(_toastT); _toastT=setTimeout(()=>t.style.opacity='0', 2200); }

// ═══════════════════════════ 資料：本機草稿（localStorage）＋自動存 ═══════════════════════════
const LS_KEY = 'dipPixelStudio_v1';
let DB = null;
try{ DB = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
if(!DB || typeof DB !== 'object' || !DB.objects) DB = P.emptyDB();
let _saveT = null;
function touch(){ $('saveState').textContent = '未存…'; clearTimeout(_saveT); _saveT = setTimeout(save, 400); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); $('saveState').textContent = '本機草稿已存 ' + new Date().toLocaleTimeString('zh-TW',{hour12:false}); }catch(e){ $('saveState').textContent = '⚠ 存不進 localStorage：' + (e.message||e); } }
window.addEventListener('beforeunload', ()=>{ if(_saveT){ clearTimeout(_saveT); save(); } });
const stamp = o => { o.updatedAt = Date.now(); };
function uniqueId(base, table){ let id = P.slug(base), n = 2; while(table[id]) id = P.slug(base) + '-' + (n++); return id; }

// ═══════════════════════════ 模式切換與素材庫 ═══════════════════════════
const ST = { mode:'obj' };
function setMode(m){
  ST.mode = m;
  $$('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + m));
  renderSide();
  if(m === 'obj') oRender(); if(m === 'scene') sRender(); if(m === 'story') tRender(); if(m === 'io') ioRender();
}
$$('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));

function thumbHTML(obj){
  if(!obj) return '';
  if(obj.kind === 'image') return `<img src="${esc(P.frameOf(obj,0))}" alt="">`;
  return P.toSVG(obj, 0, 28);
}
function renderLib(){
  const objs = Object.values(DB.objects).sort((a,b)=> a.name.localeCompare(b.name,'zh-Hant'));
  $('libObjs').innerHTML = objs.map(o => `<div class="lib-item ${O.id===o.id&&ST.mode==='obj'?'on':''}" data-t="obj" data-id="${esc(o.id)}"><span class="th">${thumbHTML(o)}</span><span class="nm">${esc(o.name)}<br><small>${o.kind==='image'?'圖檔':(P.sizeOf(o).w+'×'+P.sizeOf(o).h)}${(o.frames||[]).length>1?' ·'+o.frames.length+'格':''}</small></span></div>`).join('') || '<div class="hint">（空）</div>';
  $('libScenes').innerHTML = Object.values(DB.scenes).map(s => `<div class="lib-item ${S.id===s.id&&ST.mode==='scene'?'on':''}" data-t="scene" data-id="${esc(s.id)}"><span class="th">🏞</span><span class="nm">${esc(s.name)}<br><small>${s.w}×${s.h} · ${(s.items||[]).length} 件</small></span></div>`).join('') || '<div class="hint">（空）</div>';
  $('libStories').innerHTML = Object.values(DB.stories).map(s => `<div class="lib-item ${T.id===s.id&&ST.mode==='story'?'on':''}" data-t="story" data-id="${esc(s.id)}"><span class="th">🎬</span><span class="nm">${esc(s.name)}<br><small>${(s.beats||[]).length} 句 · ${esc((DB.scenes[s.scene]||{}).name||'未指定場景')}</small></span></div>`).join('') || '<div class="hint">（空）</div>';
}
$('lib').addEventListener('click', e => {
  const it = e.target.closest('.lib-item'); if(!it) return;
  if(it.dataset.t === 'obj'){ openObject(it.dataset.id); setMode('obj'); }
  if(it.dataset.t === 'scene'){ openScene(it.dataset.id); setMode('scene'); }
  if(it.dataset.t === 'story'){ openStory(it.dataset.id); setMode('story'); }
});
$('libNewObj').onclick = () => {
  const name = prompt('物件名稱（例：唱盤、木箱、老闆）'); if(!name) return;
  const w = clamp(parseInt(prompt('寬（像素，1–256）', '32'))||32, 1, 256), h = clamp(parseInt(prompt('高（像素，1–256）', String(w)))||w, 1, 256);
  const id = uniqueId(name, DB.objects);
  DB.objects[id] = P.newPixelObject(id, name, w, h); touch(); openObject(id); setMode('obj');
};
$('libNewScene').onclick = () => {
  const name = prompt('場景名稱（例：巷子裡的唱片行）'); if(!name) return;
  const id = uniqueId(name, DB.scenes);
  DB.scenes[id] = P.newScene(id, name, 448, 492); touch(); openScene(id); setMode('scene');
};
$('libNewStory').onclick = () => {
  const name = prompt('劇本名稱（例：序章）'); if(!name) return;
  const id = uniqueId(name, DB.stories);
  DB.stories[id] = P.newStory(id, name, S.id || Object.keys(DB.scenes)[0] || ''); touch(); openStory(id); setMode('story');
};
function renderSide(){
  const side = $('side');
  if(ST.mode === 'obj') side.innerHTML = oSideHTML();
  else if(ST.mode === 'scene') side.innerHTML = sSideHTML();
  else if(ST.mode === 'story') side.innerHTML = tSideHTML();
  else side.innerHTML = '<div class="hint">交接分頁的操作都在中間。</div>';
  bindSide();
  renderLib();
}

// ═══════════════════════════ 🖌 物件編輯器 ═══════════════════════════
const O = { id:null, frame:0, tool:'pen', color:'k', brush:1, zoom:14, grid:true, mirror:false, onion:true, ref:null, undo:[], redo:[], drag:null, hover:null, preview:null, playing:null, g:null };
const oc = $('oc'), octx = oc.getContext('2d');
const curObj = () => DB.objects[O.id] || null;
function openObject(id){
  if(O.playing){ clearInterval(O.playing); O.playing = null; }
  O.id = id; O.frame = 0; O.undo = []; O.redo = []; O.preview = null;
  const obj = curObj();
  if(obj && obj.kind === 'pixel'){ O.g = P.frameOf(obj, 0).map(r => r.split('')); if(!obj.palette[O.color]) O.color = Object.keys(obj.palette)[0] || 'k'; }
  else O.g = null;
  if(ST.mode === 'obj'){ renderSide(); oRender(); }
}
function oLoadGrid(){ const obj = curObj(); O.g = P.frameOf(obj, O.frame).map(r => r.split('')); }
function oCommit(){ const obj = curObj(); if(!obj || !O.g) return; obj.frames[O.frame] = O.g.map(r => r.join('')); stamp(obj); touch(); }
function oSnapshot(){ const obj = curObj(); if(!obj) return; O.undo.push(JSON.stringify({f:obj.frames, i:O.frame})); if(O.undo.length > 80) O.undo.shift(); O.redo = []; }
function oUndo(){ const obj = curObj(); if(!obj || !O.undo.length) return; O.redo.push(JSON.stringify({f:obj.frames, i:O.frame})); const s = JSON.parse(O.undo.pop()); obj.frames = s.f; O.frame = Math.min(s.i, obj.frames.length-1); oLoadGrid(); stamp(obj); touch(); oRender(); renderSide(); }
function oRedo(){ const obj = curObj(); if(!obj || !O.redo.length) return; O.undo.push(JSON.stringify({f:obj.frames, i:O.frame})); const s = JSON.parse(O.redo.pop()); obj.frames = s.f; O.frame = Math.min(s.i, obj.frames.length-1); oLoadGrid(); stamp(obj); touch(); oRender(); renderSide(); }

function oRender(){
  const obj = curObj();
  const empty = !obj || obj.kind !== 'pixel';
  $('objEmpty').hidden = !empty; oc.hidden = empty;
  if(empty){ if(obj && obj.kind === 'image') $('objEmpty').innerHTML = `這是圖檔物件（<code>${esc(P.frameOf(obj,0))}</code>），不能逐像素改；它可以直接放進場景。<br>`+`<img src="${esc(P.frameOf(obj,0))}" style="max-width:100%;image-rendering:pixelated;margin-top:8px;box-shadow:0 0 0 1px #111">`; else $('objEmpty').textContent = '左邊按「＋」開一個物件，或從交接分頁載入 art/pixel/。'; return; }
  const {w,h} = P.sizeOf(obj), z = O.zoom, pal = obj.palette;
  oc.width = w*z; oc.height = h*z;
  octx.clearRect(0,0,oc.width,oc.height);
  if(O.ref && O.ref.img){ octx.globalAlpha = O.ref.opacity; if(O.ref.fit) octx.drawImage(O.ref.img, 0, 0, w*z, h*z); else octx.drawImage(O.ref.img, 0, 0, O.ref.img.naturalWidth*z, O.ref.img.naturalHeight*z); octx.globalAlpha = 1; }
  if(O.onion && O.frame > 0){ const prev = P.frameOf(obj, O.frame-1); octx.globalAlpha = .28; for(let y=0;y<prev.length;y++) for(let x=0;x<prev[y].length;x++){ const c = pal[prev[y][x]]; if(c && !P.isClear(prev[y][x])){ octx.fillStyle=c; octx.fillRect(x*z,y*z,z,z); } } octx.globalAlpha = 1; }
  for(let y=0;y<h;y++){ const row = O.g[y]||[]; for(let x=0;x<w;x++){ const ch=row[x]; if(P.isClear(ch)||!pal[ch]) continue; octx.fillStyle = pal[ch]; octx.fillRect(x*z,y*z,z,z); } }
  if(O.preview){ for(const [x,y,ch] of O.preview){ if(x<0||y<0||x>=w||y>=h) continue; if(P.isClear(ch)){ octx.fillStyle='rgba(255,60,60,.45)'; } else octx.fillStyle = pal[ch]||'#000'; octx.fillRect(x*z,y*z,z,z); } }
  if(O.grid && z >= 6){ octx.strokeStyle='rgba(0,0,0,.13)'; octx.lineWidth=1; for(let x=0;x<=w;x++){ octx.beginPath(); octx.moveTo(x*z+.5,0); octx.lineTo(x*z+.5,h*z); octx.stroke(); } for(let y=0;y<=h;y++){ octx.beginPath(); octx.moveTo(0,y*z+.5); octx.lineTo(w*z,y*z+.5); octx.stroke(); }
    octx.strokeStyle='rgba(0,0,0,.3)'; for(let x=8;x<w;x+=8){ octx.beginPath(); octx.moveTo(x*z+.5,0); octx.lineTo(x*z+.5,h*z); octx.stroke(); } for(let y=8;y<h;y+=8){ octx.beginPath(); octx.moveTo(0,y*z+.5); octx.lineTo(w*z,y*z+.5); octx.stroke(); } }
  if(O.mirror){ octx.strokeStyle='rgba(184,134,11,.8)'; octx.setLineDash([4,3]); octx.beginPath(); octx.moveTo(w*z/2,0); octx.lineTo(w*z/2,h*z); octx.stroke(); octx.setLineDash([]); }
  const a = P.anchorOf(obj); octx.strokeStyle='#b8860b'; octx.lineWidth=2; octx.beginPath(); octx.moveTo(a.x*z-7,a.y*z); octx.lineTo(a.x*z+7,a.y*z); octx.moveTo(a.x*z,a.y*z-7); octx.lineTo(a.x*z,a.y*z+7); octx.stroke(); octx.lineWidth=1;

function oCell(ev){ const r = oc.getBoundingClientRect(); const {w,h} = P.sizeOf(curObj()); return { x: Math.floor((ev.clientX-r.left)/r.width*w), y: Math.floor((ev.clientY-r.top)/r.height*h) }; }
function oPlot(cells, x, y, ch){ const {w,h} = P.sizeOf(curObj()); const b = O.brush, off = Math.floor((b-1)/2);
  for(let dy=0;dy<b;dy++) for(let dx=0;dx<b;dx++){ const px=x-off+dx, py=y-off+dy; if(px<0||py<0||px>=w||py>=h) continue; cells.push([px,py,ch]); if(O.mirror) cells.push([w-1-px,py,ch]); } }
function line(x0,y0,x1,y1){ const pts=[]; let dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx+dy; for(;;){ pts.push([x0,y0]); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){ err+=dy; x0+=sx; } if(e2<=dx){ err+=dx; y0+=sy; } } return pts; }
function shapeCells(tool, a, b, ch){
  const cells = [], x0=Math.min(a.x,b.x), x1=Math.max(a.x,b.x), y0=Math.min(a.y,b.y), y1=Math.max(a.y,b.y);
  if(tool==='line'){ for(const [x,y] of line(a.x,a.y,b.x,b.y)) oPlot(cells,x,y,ch); }
  else if(tool==='rect'){ for(let x=x0;x<=x1;x++){ oPlot(cells,x,y0,ch); oPlot(cells,x,y1,ch); } for(let y=y0;y<=y1;y++){ oPlot(cells,x0,y,ch); oPlot(cells,x1,y,ch); } }
  else if(tool==='rectf'){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) cells.push([x,y,ch]); if(O.mirror){ const w=P.sizeOf(curObj()).w; for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) cells.push([w-1-x,y,ch]); } }
  else if(tool==='ellipse'){ const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=Math.max(.5,(x1-x0)/2), ry=Math.max(.5,(y1-y0)/2); const set=new Set();
    for(let t=0;t<360;t+=1){ const x=Math.round(cx+rx*Math.cos(t*Math.PI/180)), y=Math.round(cy+ry*Math.sin(t*Math.PI/180)); const k=x+','+y; if(!set.has(k)){ set.add(k); oPlot(cells,x,y,ch); } } }
  return cells;
}
function applyCells(cells){ const {w,h} = P.sizeOf(curObj()); for(const [x,y,ch] of cells){ if(x<0||y<0||x>=w||y>=h) continue; O.g[y][x] = ch; } }
function floodFill(x, y, ch){ const {w,h} = P.sizeOf(curObj()); if(x<0||y<0||x>=w||y>=h) return; const target = O.g[y][x]; const same = c => (P.isClear(c)&&P.isClear(target)) || c===target; if(same(ch)) return;
  const st=[[x,y]]; while(st.length){ const [cx,cy]=st.pop(); if(cx<0||cy<0||cx>=w||cy>=h) continue; if(!same(O.g[cy][cx])) continue; O.g[cy][cx]=ch; st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); } }
oc.addEventListener('pointerdown', ev => {
  const obj = curObj(); if(!obj || obj.kind!=='pixel') return; ev.preventDefault(); oc.setPointerCapture(ev.pointerId);
  const c = oCell(ev), ch = O.tool==='eraser' ? '.' : O.color;
  if(O.tool==='pick'){ const v = (O.g[c.y]||[])[c.x]; if(v && !P.isClear(v)){ O.color = v; renderSide(); } return; }
  if(O.tool==='anchor'){ obj.anchor = { x:c.x, y:c.y+1 }; stamp(obj); touch(); oRender(); renderSide(); return; }
  oSnapshot();
  if(O.tool==='pen' || O.tool==='eraser'){ const cells=[]; oPlot(cells,c.x,c.y,ch); applyCells(cells); O.drag={ tool:O.tool, last:c, ch }; oRender(); return; }
  if(O.tool==='fill'){ floodFill(c.x,c.y,ch); if(O.mirror){ floodFill(P.sizeOf(obj).w-1-c.x, c.y, ch); } oCommit(); oRender(); return; }
  if(O.tool==='move'){ O.drag={ tool:'move', start:c, base:O.g.map(r=>r.slice()) }; return; }
  O.drag = { tool:O.tool, start:c, ch }; O.preview = shapeCells(O.tool, c, c, ch); oRender();
});
oc.addEventListener('pointermove', ev => {
  const obj = curObj(); if(!obj || obj.kind!=='pixel') return;
  const c = oCell(ev); O.hover = c;
  if(O.drag){
    const d = O.drag;
    if(d.tool==='pen'||d.tool==='eraser'){ const cells=[]; for(const [x,y] of line(d.last.x,d.last.y,c.x,c.y)) oPlot(cells,x,y,d.ch); applyCells(cells); d.last=c; }
    else if(d.tool==='move'){ const {w,h}=P.sizeOf(obj), dx=c.x-d.start.x, dy=c.y-d.start.y; O.g = P.emptyRows(w,h).map(r=>r.split('')); for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const nx=x+dx, ny=y+dy; if(nx>=0&&ny>=0&&nx<w&&ny<h) O.g[ny][nx]=d.base[y][x]; } }
    else O.preview = shapeCells(d.tool, d.start, c, d.ch);
  }
  oRender();
});
function oEnd(){ const d = O.drag; if(!d) return; if(O.preview){ applyCells(O.preview); O.preview=null; } O.drag=null; oCommit(); oRender(); }
oc.addEventListener('pointerup', oEnd); oc.addEventListener('pointercancel', oEnd);
oc.addEventListener('pointerleave', ()=>{ O.hover=null; if(!O.drag) oRender(); });
oc.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', ev => {
  if(ev.target.matches('input,textarea,select')) return;
  const meta = ev.ctrlKey || ev.metaKey;
  if(ST.mode==='obj'){
    if(meta && ev.key.toLowerCase()==='z'){ ev.preventDefault(); ev.shiftKey ? oRedo() : oUndo(); return; }
    if(meta && ev.key.toLowerCase()==='y'){ ev.preventDefault(); oRedo(); return; }
    const keys = { b:'pen', e:'eraser', g:'fill', l:'line', r:'rect', f:'rectf', o:'ellipse', i:'pick', m:'move' };
    if(!meta && keys[ev.key.toLowerCase()]){ O.tool = keys[ev.key.toLowerCase()]; renderSide(); }
    if(ev.key==='[') { O.brush = clamp(O.brush-1,1,8); renderSide(); } if(ev.key===']'){ O.brush = clamp(O.brush+1,1,8); renderSide(); }
    if(ev.key==='x'){ O.mirror=!O.mirror; renderSide(); oRender(); }
    if(ev.key==='+'||ev.key==='='){ O.zoom=clamp(O.zoom+2,2,40); oRender(); } if(ev.key==='-'){ O.zoom=clamp(O.zoom-2,2,40); oRender(); }
  }
  if(ST.mode==='scene') sKey(ev);
});

function oAct(act){
  const obj = curObj(); if(!obj) return;
  const {w,h} = P.sizeOf(obj);
  const setRows = fn => { oSnapshot(); fn(); oCommit(); oRender(); renderSide(); };
  switch(act){
    case 'mirror': O.mirror=!O.mirror; oRender(); renderSide(); break;
    case 'grid': O.grid=!O.grid; oRender(); renderSide(); break;
    case 'undo': oUndo(); break; case 'redo': oRedo(); break;
    case 'addcolor': { const c = prompt('顏色（#hex）', '#ff8800'); if(!c || !/^#[0-9a-f]{3,8}$/i.test(c)) return; const used = new Set(Object.keys(obj.palette)); const k = KEY_POOL.split('').find(x => !used.has(x)); if(!k){ alert('色盤滿了'); return; } obj.palette[k] = c.toLowerCase(); O.color = k; stamp(obj); touch(); renderSide(); break; }
    case 'delcolor': { const k = O.color; if(k==='.') return; const used = obj.frames.some(f => f.some(r => r.includes(k))); if(used){ alert('這個顏色還有像素在用，先擦掉才能刪。'); return; } delete obj.palette[k]; O.color = Object.keys(obj.palette)[0]||'.'; stamp(obj); touch(); renderSide(); break; }
    case 'fadd': oSnapshot(); obj.frames.splice(O.frame+1, 0, obj.frames[O.frame].slice()); O.frame++; oLoadGrid(); stamp(obj); touch(); oRender(); renderSide(); break;
    case 'fdel': if(obj.frames.length<2) return; oSnapshot(); obj.frames.splice(O.frame,1); O.frame = Math.min(O.frame, obj.frames.length-1); oLoadGrid(); stamp(obj); touch(); oRender(); renderSide(); break;
    case 'fleft': if(O.frame>0){ oSnapshot(); [obj.frames[O.frame-1],obj.frames[O.frame]]=[obj.frames[O.frame],obj.frames[O.frame-1]]; O.frame--; stamp(obj); touch(); renderSide(); } break;
    case 'fright': if(O.frame<obj.frames.length-1){ oSnapshot(); [obj.frames[O.frame+1],obj.frames[O.frame]]=[obj.frames[O.frame],obj.frames[O.frame+1]]; O.frame++; stamp(obj); touch(); renderSide(); } break;
    case 'fplay': if(O.playing){ clearInterval(O.playing); O.playing=null; } else { const fps = clamp(+$('oFps').value||6,1,24); O.playing = setInterval(()=>{ O.frame=(O.frame+1)%obj.frames.length; oLoadGrid(); oRender(); $$('.frames .fr').forEach((f,i)=>f.classList.toggle('on',i===O.frame)); }, 1000/fps); } renderSide(); break;
    case 'resize': { const nw = clamp(+$('oW').value||w,1,256), nh = clamp(+$('oH').value||h,1,256); if(nw===w&&nh===h) return; setRows(()=>{ obj.frames = obj.frames.map(f => { const rows = P.emptyRows(nw,nh).map(r=>r.split('')); for(let y=0;y<Math.min(h,nh);y++) for(let x=0;x<Math.min(w,nw);x++) rows[y][x]=f[y][x]; return rows.map(r=>r.join('')); }); obj.w=nw; obj.h=nh; if(obj.anchor){ obj.anchor.x=clamp(obj.anchor.x,0,nw); obj.anchor.y=clamp(obj.anchor.y,0,nh); } oLoadGrid(); }); break; }
    case 'flipx': setRows(()=>{ O.g = O.g.map(r => r.slice().reverse()); }); break;
    case 'flipy': setRows(()=>{ O.g = O.g.slice().reverse(); }); break;
    case 'rot': setRows(()=>{ const g = P.emptyRows(h,w).map(r=>r.split('')); for(let y=0;y<h;y++) for(let x=0;x<w;x++) g[x][h-1-y]=O.g[y][x]; obj.frames = obj.frames.map((f,i)=> i===O.frame ? g.map(r=>r.join('')) : (()=>{ const gg=P.emptyRows(h,w).map(r=>r.split('')); for(let y=0;y<h;y++) for(let x=0;x<w;x++) gg[x][h-1-y]=f[y][x]; return gg.map(r=>r.join('')); })()); obj.w=h; obj.h=w; O.g=g; obj.anchor={x:Math.floor(obj.w/2),y:obj.h}; }); break;
    case 'crop': { let x0=w,y0=h,x1=-1,y1=-1; for(const f of obj.frames) for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!P.isClear(f[y][x])){ x0=Math.min(x0,x); y0=Math.min(y0,y); x1=Math.max(x1,x); y1=Math.max(y1,y); } } if(x1<0) return; const nw=x1-x0+1, nh=y1-y0+1; setRows(()=>{ obj.frames = obj.frames.map(f => f.slice(y0,y1+1).map(r=>r.slice(x0,x1+1))); obj.w=nw; obj.h=nh; if(obj.anchor){ obj.anchor={x:clamp(obj.anchor.x-x0,0,nw), y:clamp(obj.anchor.y-y0,0,nh)}; } oLoadGrid(); }); break; }
    case 'clear': setRows(()=>{ O.g = P.emptyRows(w,h).map(r=>r.split('')); }); break;
    case 'ref': pickFile('image/*').then(r => { if(!r) return; const im = new Image(); im.onload = ()=>{ O.ref = { img:im, opacity:.5, fit:true }; oRender(); renderSide(); }; im.src = r.data; }); break;
    case 'refoff': O.ref=null; oRender(); renderSide(); break;
    case 'imgimport': pickFile('image/*').then(r => { if(!r) return; const im = new Image(); im.onload = ()=> oImportImage(im); im.src = r.data; }); break;
    case 'png': { const k = clamp(+$('oScale').value||4,1,16); const src = P.rasterize(obj, O.frame); const c = document.createElement('canvas'); c.width=w*k; c.height=h*k; const g=c.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage(src,0,0,w*k,h*k); c.toBlob(b => download(`${obj.id}${obj.frames.length>1?'-f'+(O.frame+1):''}@${k}x.png`, b)); break; }
    case 'svg': copyText(P.toSVG(obj, O.frame, w*4)); break;
    case 'json': copyText(JSON.stringify(obj, null, 1)); break;
    case 'rows': copyText(JSON.stringify(obj.frames[O.frame], null, 1)); break;
    case 'dup': { const id = uniqueId(obj.name+'-copy', DB.objects); DB.objects[id] = JSON.parse(JSON.stringify(obj)); DB.objects[id].id=id; DB.objects[id].name=obj.name+' 副本'; stamp(DB.objects[id]); touch(); openObject(id); break; }

function tTargets(i){
  const st = curStory(), scn = tScene(); if(!st || !scn) return {};
  const stage = P.stageAt(st, i), acts = tActors(), out = {}, paths = {};
  const beat = st.beats[i] || {}, s = beat.stage || {};
  const anchorPos = (it, role, name) => { const an = name && P.findAnchor(scn, role, name); return an ? P.placeAt(it, DB.objects[it.obj], an.x, an.y) : null; };
  for(const role of ['p','o','f']){ const it = acts[role]; if(!it) continue;
    const pos = anchorPos(it, role, stage[role]) || { x:it.x, y:it.y };
    const hidden = role in stage.hide ? !!stage.hide[role] : (role==='f' && stage.f==='out') ? true : !!it.hidden;   // roguelike 慣例：f:'out'＝不在場
    out[it.iid] = { x:pos.x, y:pos.y, hidden };
    if(Array.isArray(s[role+'Path']) && s[role+'Path'].length) paths[it.iid] = s[role+'Path'].map(n => anchorPos(it, role, n)).filter(Boolean);
  }
  const door = scn.items.find(it => (it.name||'') === DOOR_NAME);
  if(door){ out[door.iid] = Object.assign(out[door.iid]||{ x:door.x, y:door.y }, { frame: P.DOOR_FRAME[stage.door] ?? 0 }); }
  for(const it of scn.items){ const name = it.name || (DB.objects[it.obj]||{}).name; const ss = stage.set[name]; if(ss){ out[it.iid] = Object.assign(out[it.iid]||{x:it.x,y:it.y}, ss); } }

}
function tDrawOverlay(stage){

// 重繪要序列化：drawScene 會等圖載入，兩張同時畫會互相交錯、舊的蓋掉新的。永遠只畫最新的那一張。
let _tDrawing = false, _tPending = null;
async function tDraw(stage){

    await P.drawScene(stcx, scn, DB, { pos: it => T.pos[it.iid] ? { x:T.pos[it.iid].x, y:T.pos[it.iid].y } : null,
      hidden: it => T.pos[it.iid] && 'hidden' in T.pos[it.iid] ? T.pos[it.iid].hidden : it.hidden,
      frame: it => T.pos[it.iid] && T.pos[it.iid].frame!=null ? T.pos[it.iid].frame : (it.frame|0),

function tGo(i, instant){

  const b = st.beats[i]; $('stName').textContent = b.who||''; $('stName').style.display = b.who?'':'none'; $('stName').className = 'rpg-name' + (/男子|？？？|\?\?\?/.test(b.who||'')?' foe':''); $('stText').textContent = b.text||''; $('stPos').textContent = `${i+1} / ${n}`;
  $$('#beats .beat').forEach((el,k)=>el.classList.toggle('on',k===i));

      const it = scn.items.find(x=>x.iid===iid), depth = (k < 1 && it && !it.depth) ? P.itemFoot(Object.assign({}, it, { y:seg.b.y }), DB.objects[it.obj]) : null;
      T.pos[iid] = Object.assign({}, z, keep, { x: seg.a.x+(seg.b.x-seg.a.x)*e, y: seg.a.y+(seg.b.y-seg.a.y)*e, depth }); }

      <div class="row"><button class="b pri" data-io="claude">📋 複製「給 Claude 的交接」</button><span class="hint">＝說明＋目前選取的物件／場景／劇本 JSON，貼進對話即可。</span></div>
      <div class="row"><textarea id="ioPaste" placeholder="Claude 在對話裡回你的 JSON（物件、場景、劇本或整包）貼這裡…" style="min-height:70px"></textarea></div>
      <div class="row"><button class="b" data-io="paste">⬆ 匯入貼上的 JSON</button></div></div>
    <div class="box"><h4>③ 直接推到 GitHub（免下載、Claude 雲端工作階段拉分支就看得到）</h4>
      <p>要一個 <b>fine-grained personal access token</b>：只勾這個 repo、Contents 權限 Read and write。token 只存在這個瀏覽器（localStorage），不會進 repo。分支建議填你正在跟 Claude 一起跑的那條。</p>
      <div class="row"><label class="f inl">owner/repo<input type="text" id="ghRepo" value="${esc(GH.repo||'kubinice06-blip/dip-vinyl-shop')}" style="width:220px"></label><label class="f inl">branch<input type="text" id="ghBranch" value="${esc(GH.branch||'main')}" style="width:200px"></label></div>
      <div class="row"><label class="f inl">token<input type="password" id="ghToken" value="${esc(GH.token||'')}" style="width:300px" autocomplete="off"></label><label class="f inl"><input type="checkbox" id="ghRemember" ${GH.token?'checked':''}>記住 token</label></div>
      <div class="row"><button class="b" data-io="ghpull">⬇ 從 GitHub 載入 art/pixel/</button><button class="b pri" data-io="ghpush">⬆ 推到 GitHub（只寫有改過的檔）</button><label class="f inl">commit 訊息<input type="text" id="ghMsg" value="像素工坊：更新 art/pixel" style="width:220px"></label></div>
      <div class="log" id="ioLog" hidden></div></div>
    <div class="box"><h4>危險區</h4><div class="row"><button class="b" data-io="wipe">清空本機草稿</button><span class="hint">先匯出再清。</span></div></div>`;
  $('ioPanel').onclick = e => { const b = e.target.closest('[data-io]'); if(b) ioAct(b.dataset.io); };
}
const log = m => { const l = $('ioLog'); l.hidden=false; l.textContent += m + '\n'; l.scrollTop = l.scrollHeight; };
function fileOf(kind, id){ return `art/pixel/${kind}/${id}.json`; }
function buildIndex(){ const ent = t => Object.values(DB[t]).map(o => ({ id:o.id, name:o.name, kind:o.kind, file:fileOf(t,o.id), updatedAt:o.updatedAt||0 })); return { version:1, generatedAt:new Date().toISOString(), objects:ent('objects'), scenes:ent('scenes'), stories:ent('stories') }; }
function mergeIn(kind, item, force){ if(!item || !item.id) return false; const cur = DB[kind][item.id]; if(cur && !force && (cur.updatedAt||0) > (item.updatedAt||0)) return false; DB[kind][item.id] = item; return true; }
// 目前沒選東西（例如本機草稿原本是空的）就自動選第一筆，切到分頁時才有東西看
function ensureSelection(){
  if(!curObj() && Object.keys(DB.objects).length) openObject(Object.keys(DB.objects)[0]);
  if(!curScene() && Object.keys(DB.scenes).length) S.id = Object.keys(DB.scenes)[0];
  if(!curStory() && Object.keys(DB.stories).length) T.id = Object.keys(DB.stories)[0];
}
function importAny(data, force){
  let n = 0;
  const kindOf = o => o.beats ? 'stories' : o.items ? 'scenes' : (o.frames||o.kind) ? 'objects' : null;
  if(data && data.objects && typeof data.objects==='object' && !Array.isArray(data.objects)){ for(const k of ['objects','scenes','stories']) for(const it of Object.values(data[k]||{})) if(mergeIn(k, it, force)) n++; }
  else if(Array.isArray(data)){ for(const o of data){ const k=kindOf(o); if(k && mergeIn(k,o,force)) n++; } }
  else if(data && kindOf(data)){ if(mergeIn(kindOf(data), data, force)) n++; }
  else throw new Error('看不懂這份 JSON（不是物件／場景／劇本／整包）');
  ensureSelection(); touch(); renderLib(); return n;
}
async function ioAct(act){
  const force = !!($('ioForce')&&$('ioForce').checked);
  try{
    if(act==='site'){ log('讀 art/pixel/index.json …'); const r = await fetch('art/pixel/index.json?t='+Date.now()); if(!r.ok) throw new Error('本站沒有 art/pixel/index.json（HTTP '+r.status+'）'); const idx = await r.json(); let n=0; for(const k of ['objects','scenes','stories']) for(const e of idx[k]||[]){ const rr = await fetch(e.file+'?t='+Date.now()); if(!rr.ok){ log('  ✗ '+e.file); continue; } if(mergeIn(k, await rr.json(), force)){ n++; log('  ✓ '+e.file); } else log('  = '+e.file+'（本機較新，略過）'); } ensureSelection(); touch(); renderLib(); toast(`載入 ${n} 筆`); }
    if(act==='bundle'){ download('pixel-bundle.json', new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'})); }
    if(act==='files'){ for(const k of ['objects','scenes','stories']) for(const o of Object.values(DB[k])) download(`${o.id}.json`, new Blob([JSON.stringify(o, null, 1)], {type:'application/json'})); download('index.json', new Blob([JSON.stringify(buildIndex(), null, 1)], {type:'application/json'})); }
    if(act==='import'){ const r = await pickFile('.json,application/json','text'); if(!r) return; const n = importAny(JSON.parse(r.data), force); toast(`匯入 ${n} 筆`); }
    if(act==='paste'){ const t = $('ioPaste').value.trim(); if(!t) return; const n = importAny(JSON.parse(t), true); $('ioPaste').value=''; toast(`匯入 ${n} 筆`); }
    if(act==='claude'){ const parts=[]; const obj=curObj(), scn=curScene(), st=curStory(); if(obj) parts.push(obj); if(scn) parts.push(scn); if(st) parts.push(st); if(!parts.length){ alert('先在物件／場景／劇本分頁選一個東西。'); return; }
      const md = `以下是我用像素工坊（pixel-studio.html）做的資料，格式見 repo 的 PIXEL_STUDIO.md（像素物件的 frames 每列一字串、一字元一像素、'.' 透明、其他字元查 palette；場景 items 的深度照腳底 y 排；劇本 beats 與 roguelike.html 的 RPG_BEATS 同形）。\n請把它們寫進 art/pixel/（檔名 <kind>/<id>.json，並更新 art/pixel/index.json），然後：\n\n（這裡寫你要 Claude 做的事）\n\n\`\`\`json\n${JSON.stringify(parts.length===1?parts[0]:parts, null, 1)}\n\`\`\``; copyText(md); }
    if(act==='wipe'){ if(!confirm('清空本機草稿？（沒匯出的就沒了）')) return; DB = P.emptyDB(); O.id=null; S.id=null; T.id=null; save(); renderLib(); renderSide(); toast('已清空'); }
    if(act==='ghpull' || act==='ghpush'){
      GH.repo = $('ghRepo').value.trim(); GH.branch = $('ghBranch').value.trim() || 'main'; const token = $('ghToken').value.trim(); if(!token) throw new Error('沒有 token');
      if($('ghRemember').checked) GH.token = token; else delete GH.token; localStorage.setItem(GH_KEY, JSON.stringify(GH));
      const api = async (path, opt) => { const r = await fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+path+(opt&&opt.method==='PUT'?'':'?ref='+encodeURIComponent(GH.branch)+'&t='+Date.now()), Object.assign({ headers:{ Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'Content-Type':'application/json' } }, opt||{})); if(r.status===404) return null; if(!r.ok) throw new Error(`GitHub ${r.status}：${(await r.text()).slice(0,200)}`); return r.json(); };
      const dec = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))), enc = s => btoa(unescape(encodeURIComponent(s)));
      if(act==='ghpull'){ log(`從 ${GH.repo}@${GH.branch} 讀 art/pixel/index.json …`); const ix = await api('art/pixel/index.json'); if(!ix) throw new Error('那條分支上沒有 art/pixel/index.json'); const idx = JSON.parse(dec(ix.content)); let n=0; for(const k of ['objects','scenes','stories']) for(const e of idx[k]||[]){ const f = await api(e.file); if(!f){ log('  ✗ '+e.file); continue; } if(mergeIn(k, JSON.parse(dec(f.content)), force)){ n++; log('  ✓ '+e.file); } else log('  = '+e.file+'（本機較新，略過）'); } ensureSelection(); touch(); renderLib(); toast(`載入 ${n} 筆`); }
      else { const msg = $('ghMsg').value.trim() || '像素工坊：更新 art/pixel'; const files = []; for(const k of ['objects','scenes','stories']) for(const o of Object.values(DB[k])) files.push([fileOf(k,o.id), JSON.stringify(o, null, 1)+'\n']); files.push(['art/pixel/index.json', JSON.stringify(buildIndex(), null, 1)+'\n']);
        let n=0; for(const [path, text] of files){ const cur = await api(path); if(cur && dec(cur.content)===text){ log('  = '+path); continue; } await api(path, { method:'PUT', body: JSON.stringify({ message: msg + ' — ' + path.split('/').pop(), content: enc(text), branch: GH.branch, sha: cur ? cur.sha : undefined }) }); n++; log('  ✓ '+path); }
        toast(`推了 ${n} 個檔到 ${GH.branch}`); log(n ? `完成：${n} 個檔已 commit 到 ${GH.repo}@${GH.branch}。跟 Claude 說「art/pixel 有新東西，先 git pull」。` : '沒有需要更新的檔。'); }
    }
  }catch(err){ log('✗ '+(err.message||err)); alert(err.message||err); }
}

// ═══════════════════════════ 啟動 ═══════════════════════════
(function init(){
  const first = t => Object.keys(DB[t])[0];
  if(first('objects')) O.id = first('objects'); if(O.id){ const o=DB.objects[O.id]; if(o.kind==='pixel') O.g = P.frameOf(o,0).map(r=>r.split('')); }
  if(first('scenes')) S.id = first('scenes'); if(first('stories')) T.id = first('stories');
  const m = new URLSearchParams(location.search).get('mode'); setMode(['obj','scene','story','io'].includes(m)?m:'obj');
  if(!Object.keys(DB.objects).length && !Object.keys(DB.scenes).length){ fetch('art/pixel/index.json').then(r => r.ok ? r.json() : null).then(idx => { if(idx && confirm('本機草稿是空的。要從本站載入 art/pixel/ 的現成物件與場景嗎？')) { setMode('io'); ioAct('site'); } }).catch(()=>{}); }
  window.addEventListener('resize', ()=>{ if(ST.mode==='scene') sRender(); if(ST.mode==='story') tRender(); });
})();
</script>
</body>
