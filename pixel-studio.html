<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素工坊 · dip</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --black:#111; --gold:#b8860b; --line:#d8d4cc; --gray:#777; --bg:#f4f2ec; --panel:#fff; --mono:'Space Mono',ui-monospace,monospace; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--black); font-family:var(--mono); font-size:11px; display:flex; flex-direction:column; overflow:hidden; }
  header{ display:flex; align-items:center; gap:14px; padding:6px 12px; border-bottom:2px solid var(--black); background:#fff; flex:0 0 auto; }
  header b{ font-size:13px; letter-spacing:.1em; }
  .modes{ display:flex; border:1px solid var(--black); }
  .modes button{ font-family:var(--mono); font-size:10px; font-weight:700; padding:6px 12px; border:0; border-right:1px solid var(--black); background:#fff; cursor:pointer; }
  .modes button:last-child{ border-right:0; }
  .modes button.on{ background:var(--black); color:#fff; }
  #saveState{ margin-left:auto; color:var(--gray); font-size:10px; }
  .app{ flex:1 1 auto; display:grid; grid-template-columns:200px 1fr 320px; min-height:0; }
  .app.libhide{ grid-template-columns:0 1fr 320px; }
  aside{ background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:8px; }
  .app.libhide #lib{ display:none; }
  #side{ border-right:0; border-left:1px solid var(--line); }
  main{ min-width:0; min-height:0; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  section.view{ display:none; flex:1; min-height:0; }
  section.view.on{ display:flex; flex-direction:column; }
  h3{ font-size:10px; letter-spacing:.12em; color:var(--gray); margin:10px 0 4px; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  h3:first-child{ margin-top:0; }
  .lib-item{ display:flex; align-items:center; gap:6px; padding:4px 6px; cursor:pointer; border:1px solid transparent; }
  .lib-item:hover{ background:#f1efe8; }
  .lib-item.on{ border-color:var(--black); background:#fff; }
  .lib-item .th{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:repeating-conic-gradient(#e6e3db 0 25%,#fff 0 50%) 0 0/8px 8px; flex:0 0 auto; overflow:hidden; }
  .lib-item .th svg,.lib-item .th img{ max-width:100%; max-height:100%; image-rendering:pixelated; }
  .lib-item .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-item small{ color:var(--gray); }
  button.b, .b{ font-family:var(--mono); font-size:10px; font-weight:700; padding:5px 8px; border:1px solid var(--black); background:#fff; color:var(--black); cursor:pointer; text-decoration:none; display:inline-block; line-height:1.2; }
  button.b:hover{ background:#f1efe8; }
  button.b.pri{ background:var(--black); color:#fff; }
  button.b.on{ background:var(--gold); color:#fff; border-color:var(--gold); }
  button.b.sm{ padding:3px 5px; font-size:9px; }
  button.b:disabled{ opacity:.4; cursor:default; }
  .row{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
  label.f{ display:flex; flex-direction:column; gap:2px; font-size:10px; color:var(--gray); }
  label.f.inl{ flex-direction:row; align-items:center; gap:4px; }
  input[type=text],input[type=number],select,textarea{ font-family:var(--mono); font-size:11px; padding:4px 6px; border:1px solid var(--line); background:#fff; color:var(--black); width:100%; }
  input[type=number]{ width:60px; }
  textarea{ resize:vertical; min-height:48px; }
  .hint{ color:var(--gray); font-size:10px; line-height:1.7; }
  kbd{ font-family:var(--mono); border:1px solid var(--line); padding:0 3px; font-size:9px; background:#fff; }
  .stage-wrap{ padding:14px; flex:1; overflow:auto; }
  .stage{ position:relative; display:inline-block; box-shadow:0 0 0 2px var(--black); background:#3a2a18; line-height:0; }
  .stage canvas{ image-rendering:pixelated; display:block; }
  .stage canvas.ov{ position:absolute; left:0; top:0; touch-action:none; }
  .items .it{ display:flex; align-items:center; gap:4px; padding:3px 4px; cursor:pointer; border:1px solid transparent; }
  .items .it.on{ border-color:var(--black); background:#fff; }
  .items .it:hover{ background:#f1efe8; }
  .items .it .nm{ flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .items .it .ic{ cursor:pointer; opacity:.5; } .items .it .ic.on{ opacity:1; }
  .role{ font-size:9px; padding:0 4px; border:1px solid var(--gold); color:var(--gold); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:3px 8px; font-size:10px; color:var(--gray); }
  .kv b{ color:var(--black); font-weight:400; }
  .beat{ border:1px solid var(--line); background:#fff; padding:6px; margin-bottom:6px; }
  .beat.on{ border-color:var(--black); box-shadow:0 0 0 1px var(--black); }
  .beat .hd{ display:flex; gap:6px; align-items:center; }
  .beat .hd .n{ font-size:9px; color:var(--gray); width:24px; }
  .beat textarea{ min-height:40px; margin-top:4px; }
  .beat .st{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; align-items:center; }
  .beat .st select,.beat .st input{ width:auto; }
  .rpg-win{ position:relative; background:#000; color:#fff; border:4px double #fff; padding:16px 16px 22px; min-height:88px; margin-top:8px; }
  .rpg-name{ position:absolute; left:12px; top:-12px; background:#000; color:#fff; border:2px solid #fff; padding:1px 10px; font-size:11px; font-weight:700; letter-spacing:.1em; }
  .rpg-name.foe{ border-color:#ff6b7a; color:#ff6b7a; }
  .rpg-text{ font-size:13px; line-height:1.95; letter-spacing:.04em; }
  .io{ padding:16px; max-width:820px; overflow:auto; }
  .io .box{ border:1px solid var(--line); background:#fff; padding:12px; margin-bottom:14px; }
  .io .box h4{ margin:0 0 6px; font-size:11px; letter-spacing:.08em; }
  .io p{ color:var(--gray); line-height:1.8; margin:4px 0 8px; }
  .log{ font-size:10px; background:#111; color:#ddd; padding:8px; max-height:180px; overflow:auto; white-space:pre-wrap; margin-top:8px; }
  .story-wrap{ display:grid; grid-template-columns:1fr 360px; gap:14px; padding:14px; flex:1; overflow:auto; }
  .story-wrap > div{ min-width:0; }
  @media (max-width:900px){ .app{ grid-template-columns:140px 1fr; } #side{ grid-column:1/-1; border-top:1px solid var(--line); max-height:40vh; } .story-wrap{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <b>🎨 像素工坊</b>
  <nav class="modes">
    <button data-m="scene" class="on">🏞 場景</button>
    <button data-m="story">🎬 劇本</button>
    <button data-m="io">🔁 交接</button>
  </nav>
  <button class="b pri" id="openEditor" title="開啟像素繪圖器（Aseprite 式，一格一格畫）">🖌 繪圖器</button>
  <button class="b sm" id="libToggle" title="收合素材庫">☰ 素材庫</button>
  <span id="saveState">本機草稿</span>
</header>
<div class="app" id="app">
  <aside id="lib">
    <h3>物件 <button class="b sm" id="libNewObj" title="在繪圖器開一個新物件">＋</button></h3>
    <div class="hint" style="margin:-2px 0 4px">點一下＝在繪圖器打開</div>
    <div id="libObjs"></div>
    <h3>場景 <button class="b sm" id="libNewScene">＋</button></h3>
    <div id="libScenes"></div>
    <h3>劇本 <button class="b sm" id="libNewStory">＋</button></h3>
    <div id="libStories"></div>
  </aside>

  <main>
    <section class="view on" id="v-scene"><div class="stage-wrap"><div class="hint" id="sceneEmpty">左邊按「＋」開一個場景。</div><div class="stage" id="stage" hidden><canvas id="sc"></canvas><canvas id="sco" class="ov"></canvas></div><div class="hint" id="sceneRead" style="margin-top:8px"></div></div></section>
    <section class="view" id="v-story">
      <div class="story-wrap">
        <div>
          <div class="row"><b id="stTitle"></b><span class="hint" id="stSceneName"></span></div>
          <div class="stage" id="ststage" hidden><canvas id="stc"></canvas><canvas id="stco" class="ov"></canvas></div>
          <div class="rpg-win" id="stWin" hidden><div class="rpg-name" id="stName"></div><div class="rpg-text" id="stText"></div></div>
          <div class="row" style="margin-top:8px">
            <button class="b" id="stFirst">⏮ 從頭</button><button class="b" id="stPrev">◀</button><button class="b pri" id="stNext">▶ 下一段</button>
            <button class="b" id="stPlay">▶▶ 自動播放</button><span class="hint" id="stPos"></span>
          </div>
          <div class="hint" id="storyEmpty">左邊按「＋」開一個劇本，再指定它用哪個場景。演員＝場景裡 role 設成 p／o／f 的物件；站位＝場景裡同組的站位名。</div>
        </div>
        <div id="beats"></div>
      </div>
    </section>
    <section class="view" id="v-io"><div class="io" id="ioPanel"></div></section>
  </main>

  <aside id="side"></aside>
</div>

<script src="dip-pixel.js?v=3"></script>
<script>
'use strict';
// 像素工坊：場景合成 ＋ 劇本 ＋ 與 Claude 的交接。
// 逐像素繪圖已經搬到獨立的 pixel-editor.html（Aseprite 式版面），這裡只留「開繪圖器」。
const P = window.DipPixel;
const $ = id => document.getElementById(id), $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2,8);
const hex6 = c => { c = String(c||'').trim(); const m = /^#([0-9a-f]{3})$/i.exec(c); return m ? '#' + m[1].split('').map(x=>x+x).join('') : c.slice(0,7); };
function download(name, blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800); }
function readFile(file, as){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; as==='text'? r.readAsText(file) : r.readAsDataURL(file); }); }
function pickFile(accept, as){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=async()=>{ const f=i.files[0]; res(f? {file:f, data: await readFile(f, as)} : null); }; i.click(); }); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('已複製到剪貼簿'); }catch(e){ prompt('瀏覽器不給剪貼簿權限，自己複製：', t); } }
let _toastT; function toast(m){ let t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;font-size:11px;z-index:99;border:1px solid var(--gold);transition:opacity .3s;pointer-events:none'; document.body.appendChild(t); } t.textContent=m; t.style.opacity='1'; clearTimeout(_toastT); _toastT=setTimeout(()=>t.style.opacity='0', 2200); }

// ═══════════ 資料：IndexedDB（與繪圖器共用同一份素材庫）═══════════
const LS_KEY = 'dipPixelStudio_v1', IDB_NAME = 'dipPixelStudio', IDB_KEY = 'db';
const idb = {
  open(){ return new Promise((res, rej) => { if(!window.indexedDB) return rej(new Error('no idb')); const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv','readonly').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v){ const d = await this.open(); return new Promise((res, rej) => { const tx = d.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
};
let DB = P.emptyDB();
let EDIT_ID = null;   // 最後一次在繪圖器打開的物件（交接分頁會一起打包）
async function loadDB(){
  try{ const v = await idb.get(IDB_KEY); if(v && v.objects){ DB = v; return 'idb'; } }catch(e){}
  try{ const v = JSON.parse(localStorage.getItem(LS_KEY)); if(v && v.objects){ DB = v; return 'ls'; } }catch(e){}
  return 'empty';
}
// 存檔：讀回最新的整份庫，只換自己這一頁改過的場景／劇本，避免蓋掉繪圖器剛存的物件
let _saveT = null, _wq = Promise.resolve();
function touch(){ $('saveState').textContent = '未存…'; clearTimeout(_saveT); _saveT = setTimeout(save, 500); }
function save(){
  clearTimeout(_saveT);
  _wq = _wq.then(async () => {
    let cur = null;
    try{ cur = await idb.get(IDB_KEY); }catch(e){}
    if(cur && cur.objects){
      // 物件以儲存體為準（繪圖器那邊才是物件的主人），除非本頁匯入了更新的
      for(const id in DB.objects){ const a = DB.objects[id], b = cur.objects[id];
        if(!b || (a.updatedAt||0) > (b.updatedAt||0)) cur.objects[id] = a; }
      cur.scenes = DB.scenes; cur.stories = DB.stories;
      DB = cur;
    } else cur = DB;
    try{ await idb.set(IDB_KEY, DB); $('saveState').textContent = '本機草稿已存 ' + new Date().toLocaleTimeString('zh-TW',{hour12:false}); }
    catch(e){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); $('saveState').textContent = '已存（localStorage）'; }
      catch(e2){ $('saveState').textContent = '⚠ 存不進去：' + (e2.message||e2); } }
  }).catch(()=>{});
  return _wq;
}
window.addEventListener('beforeunload', ()=>{ if(_saveT){ clearTimeout(_saveT); save(); } });
// 回到這一頁時重讀素材庫（繪圖器可能剛改過物件）
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState !== 'visible' || _saveT) return;
  try{ const v = await idb.get(IDB_KEY); if(v && v.objects){ DB.objects = v.objects; renderLib(); if(ST.mode==='scene') sRender(); if(ST.mode==='story') tRender(); } }catch(e){}
});
const stamp = o => { o.updatedAt = Date.now(); };
function uniqueId(base, table){ let id = P.slug(base), n = 2; while(table[id]) id = P.slug(base) + '-' + (n++); return id; }
const openEditor = id => { save(); location.href = 'pixel-editor.html' + (id ? '?id=' + encodeURIComponent(id) : ''); };

// ═══════════ 模式切換與素材庫 ═══════════
const ST = { mode:'scene' };
function setMode(m){
  ST.mode = m;
  $$('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $$('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + m));
  renderSide();
  if(m === 'scene') sRender(); if(m === 'story') tRender(); if(m === 'io') ioRender();
}
$$('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
$('libToggle').onclick = () => { $('app').classList.toggle('libhide'); if(ST.mode==='scene') sRender(); if(ST.mode==='story') tRender(); };
$('openEditor').onclick = () => openEditor(EDIT_ID || '');

const thumbCache = new Map();
function thumbHTML(obj){
  if(!obj) return '';
  if(obj.kind === 'image') return `<img src="${esc(P.frameOf(obj,0))}" alt="">`;
  const k = obj.id + '@' + (obj.updatedAt||0); let u = thumbCache.get(k);
  if(!u){ try{ u = P.rasterize(obj, 0).toDataURL(); }catch(e){ u=''; } if(thumbCache.size > 300) thumbCache.clear(); thumbCache.set(k, u); }
  return u ? `<img src="${u}" alt="">` : '';
}
function renderLib(){
  const objs = Object.values(DB.objects).sort((a,b)=> a.name.localeCompare(b.name,'zh-Hant'));
  $('libObjs').innerHTML = objs.map(o => `<div class="lib-item" data-t="obj" data-id="${esc(o.id)}" title="${o.kind==='pixel'?'在繪圖器打開':'圖檔物件（不能逐像素改）'}"><span class="th">${thumbHTML(o)}</span><span class="nm">${esc(o.name)}<br><small>${o.kind==='image'?'圖檔':(P.sizeOf(o).w+'×'+P.sizeOf(o).h)}${(o.frames||[]).length>1?' ·'+o.frames.length+'格':''}${(o.layers||[]).length>1?' ·'+o.layers.length+'層':''}</small></span></div>`).join('') || '<div class="hint">（空）</div>';
  $('libScenes').innerHTML = Object.values(DB.scenes).map(s => `<div class="lib-item ${S.id===s.id&&ST.mode==='scene'?'on':''}" data-t="scene" data-id="${esc(s.id)}"><span class="th">🏞</span><span class="nm">${esc(s.name)}<br><small>${s.w}×${s.h} · ${(s.items||[]).length} 件</small></span></div>`).join('') || '<div class="hint">（空）</div>';
  $('libStories').innerHTML = Object.values(DB.stories).map(s => `<div class="lib-item ${T.id===s.id&&ST.mode==='story'?'on':''}" data-t="story" data-id="${esc(s.id)}"><span class="th">🎬</span><span class="nm">${esc(s.name)}<br><small>${(s.beats||[]).length} 句 · ${esc((DB.scenes[s.scene]||{}).name||'未指定場景')}</small></span></div>`).join('') || '<div class="hint">（空）</div>';
}
$('lib').addEventListener('click', e => {
  const it = e.target.closest('.lib-item'); if(!it) return;
  if(it.dataset.t === 'obj'){ const o = DB.objects[it.dataset.id];
    if(o && o.kind !== 'pixel'){ toast('圖檔物件不能逐像素改；要編輯請在繪圖器用「匯入圖片」'); return; }
    openEditor(it.dataset.id); }
  if(it.dataset.t === 'scene'){ openScene(it.dataset.id); setMode('scene'); }
  if(it.dataset.t === 'story'){ openStory(it.dataset.id); setMode('story'); }
});
const SIZE_PRESETS = [['448×492 唱片行舞台',448,492],['390×600 對戰直式',390,600],['560×315 橫幅 16:9',560,315],['256×256',256,256]];
$('libNewObj').onclick = () => openEditor('');
$('libNewScene').onclick = () => {
  const name = prompt('場景名稱（例：巷子裡的唱片行、對戰畫面、聆聽室）'); if(!name) return;
  const pick = prompt('尺寸「寬x高」或預設編號\n' + SIZE_PRESETS.map((p,i)=>`${i+1}. ${p[0]}`).join('\n'), '448x492'); if(pick==null) return;
  let w=448,h=492; const pre = SIZE_PRESETS[parseInt(pick,10)-1]; const m = /^(\d+)\s*[x×*,]\s*(\d+)$/i.exec(pick.trim());
  if(m){ w=+m[1]; h=+m[2]; } else if(pre && !/[x×]/i.test(pick)){ w=pre[1]; h=pre[2]; }
  const id = uniqueId(name, DB.scenes);
  DB.scenes[id] = P.newScene(id, name, clamp(w,16,4096), clamp(h,16,4096)); touch(); openScene(id); setMode('scene');
};
$('libNewStory').onclick = () => {
  const name = prompt('劇本名稱（例：序章、對戰開場）'); if(!name) return;
  const id = uniqueId(name, DB.stories);
  DB.stories[id] = P.newStory(id, name, S.id || Object.keys(DB.scenes)[0] || ''); touch(); openStory(id); setMode('story');
};
function renderSide(){
  const side = $('side');
  if(ST.mode === 'scene') side.innerHTML = sSideHTML();
  else if(ST.mode === 'story') side.innerHTML = tSideHTML();
  else side.innerHTML = '<div class="hint">交接分頁的操作都在中間。</div>';
  bindSide();
  renderLib();
}
// ═══════════════════════════ 🏞 場景合成 ═══════════════════════════
const S = { id:null, sel:null, selA:-1, addAnchor:null, drag:null, css:1, showAnchors:true, showGrid:false, raf:0 };
const sc = $('sc'), scx = sc.getContext('2d'), sco = $('sco'), sox = sco.getContext('2d');
const curScene = () => DB.scenes[S.id] || null;
function openScene(id){ S.id = id; S.sel = null; S.selA = -1; S.addAnchor = null; if(ST.mode==='scene'){ renderSide(); sRender(); } }
function sFit(){ const scn = curScene(); if(!scn) return; const wrap = $('v-scene').querySelector('.stage-wrap'); const avail = Math.max(200, wrap.clientWidth - 30), availH = Math.max(200, wrap.clientHeight - 60); S.css = Math.min(avail/scn.w, availH/scn.h, 3); if(S.css > 1) S.css = Math.floor(S.css*4)/4; const cw = Math.round(scn.w*S.css), ch = Math.round(scn.h*S.css); [sc,sco].forEach(c => { c.width=scn.w; c.height=scn.h; c.style.width=cw+'px'; c.style.height=ch+'px'; }); }
async function sRender(){
  const scn = curScene(); const empty = !scn; $('sceneEmpty').hidden = !empty; $('stage').hidden = empty; if(empty) return;
  sFit();
  await P.drawScene(scx, scn, DB);
  sOverlay();

const DOOR_NAME = '門';

// 重繪要序列化：drawScene 會等圖載入，兩張同時畫會互相交錯、舊的蓋掉新的。永遠只畫最新的那一張。

      else { const msg = $('ghMsg').value.trim() || '像素工坊：更新 art/pixel'; const files = []; for(const k of ['objects','scenes','stories']) for(const o of Object.values(DB[k])) files.push([fileOf(k,o.id), JSON.stringify(o, null, 1)+'\n']); files.push(['art/pixel/index.json', JSON.stringify(buildIndex(), null, 1)+'\n']);
        let n=0; for(const [path, text] of files){ const cur = await api(path); if(cur && dec(cur.content)===text){ log('  = '+path); continue; } await api(path, { method:'PUT', body: JSON.stringify({ message: msg + ' — ' + path.split('/').pop(), content: enc(text), branch: GH.branch, sha: cur ? cur.sha : undefined }) }); n++; log('  ✓ '+path); }
        toast(`推了 ${n} 個檔到 ${GH.branch}`); log(n ? `完成：${n} 個檔已 commit 到 ${GH.repo}@${GH.branch}。跟 Claude 說「art/pixel 有新東西，先 git pull」。` : '沒有需要更新的檔。'); }
    }
  }catch(err){ log('✗ '+(err.message||err)); alert(err.message||err); }
}


// ═══════════ 右側面板事件（共用委派）═══════════
function bindSide(){
  const side = $('side');
  side.onclick = e => {
    const b = e.target.closest('[data-act],.it');
    if(!b) return;
    if(b.classList.contains('it')){
      const tg = e.target.closest('.ic'); const scn = curScene();
      if(b.dataset.iid){ const it = scn.items.find(i=>i.iid===b.dataset.iid);
        if(tg){ it[tg.dataset.tg] = !it[tg.dataset.tg]; stamp(scn); touch(); } else { S.sel = it.iid; S.selA=-1; }
        renderSide(); sRender(); }
      if(b.dataset.ai!=null){ S.selA=+b.dataset.ai; S.sel=null; renderSide(); sOverlay(); }
      return; }
    const act = b.dataset.act;
    if(ST.mode==='scene') sAct(act); else if(ST.mode==='story') tAct(act);
  };
  side.onchange = e => {
    const t = e.target; const scn = curScene(), st = curStory();
    if(t.dataset.sk && scn){ const k=t.dataset.sk; if(k==='name') scn.name=t.value.trim()||scn.name; if(k==='w'||k==='h') scn[k]=clamp(+t.value||scn[k],16,4096); if(k==='bg') scn.bg = t.value.trim()? {src:t.value.trim()} : null; if(k==='bgColor') scn.bgColor = t.value.trim()||null; if(k==='bgColorPick') scn.bgColor = t.value; if(k==='notes') scn.notes=t.value; stamp(scn); touch(); renderLib(); renderSide(); sRender(); }
    if(t.dataset.ik && scn){ const it=sItem(); if(!it) return; const k=t.dataset.ik; if(k==='flip') it.flip=t.checked; else if(k==='depth') it.depth = t.value===''? null : +t.value; else if(['x','y','scale','frame'].includes(k)) it[k]=+t.value; else it[k]=t.value; stamp(scn); touch(); renderSide(); sRender(); }
    if(t.dataset.ak && scn){ const a=scn.anchors[S.selA]; if(!a) return; const k=t.dataset.ak; a[k] = (k==='x'||k==='y') ? +t.value : t.value; stamp(scn); touch(); renderSide(); sRender(); }
    if(t.dataset.tk && st){ const k=t.dataset.tk; if(k==='name') st.name=t.value.trim()||st.name; else st[k]=t.value; stamp(st); touch(); T.pos={}; renderSide(); tRender(); }
  };
}

// ═══════════ 啟動 ═══════════
(async function init(){
  const src = await loadDB();
  if(src === 'ls') save();   // 舊的 localStorage 草稿搬進 IndexedDB
  const first = t => Object.keys(DB[t])[0];
  if(first('scenes')) S.id = first('scenes');
  if(first('stories')) T.id = first('stories');
  try{ EDIT_ID = localStorage.getItem('dipPixelEditorLast') || null; }catch(e){}
  const m = new URLSearchParams(location.search).get('mode');
  setMode(['scene','story','io'].includes(m) ? m : 'scene');
  if(!Object.keys(DB.objects).length && !Object.keys(DB.scenes).length){
    fetch('art/pixel/index.json').then(r => r.ok ? r.json() : null).then(idx => {
      if(idx && confirm('本機草稿是空的。要從本站載入 art/pixel/ 的現成物件與場景嗎？')){ setMode('io'); ioAct('site'); }
    }).catch(()=>{});
  }
  window.addEventListener('resize', ()=>{ if(ST.mode==='scene') sRender(); if(ST.mode==='story') tRender(); });
})();
</script>
